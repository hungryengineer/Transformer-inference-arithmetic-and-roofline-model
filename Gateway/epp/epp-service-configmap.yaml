apiVersion: v1
kind: Service
metadata:
  name: vllm-epp-epp
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-epp-epp
spec:
  type: ClusterIP
  selector:
    llm-d-router-gateway: vllm-epp-epp
  ports:
    - name: grpc-ext-proc
      port: 9002
      targetPort: 9002
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: http-metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-epp-epp
  namespace: default
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
