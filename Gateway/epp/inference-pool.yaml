apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-epp
  namespace: default
spec:
  selector:
    matchLabels:
      app: vllm
  targetPorts:
    - number: 8000
  appProtocol: http
  endpointPickerRef:
    name: vllm-epp-epp
    kind: Service
    port:
      number: 9002
    failureMode: FailOpen
