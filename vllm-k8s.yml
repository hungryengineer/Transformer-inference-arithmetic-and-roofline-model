apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  serviceName: vllm-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          args:
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.45"
            - "--enforce-eager"
            - "--max-model-len"
            - "2048"
            - "--kernel-config"
            - '{"enable_jit_warmup": false, "enable_cutedsl_warmup": false, "enable_flashinfer_autotune": false}'
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "0"
          resources:
            limits:
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-headless
spec:
  clusterIP: None
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
